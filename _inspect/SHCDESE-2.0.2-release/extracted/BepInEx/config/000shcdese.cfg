# Default value: false
GenerateLuaDocumentation = false

[General]

## Toggle debug mode
# Setting type: Boolean
# Default value: false
DebugMode = false

## Minimum game speed
# Setting type: UInt16
# Default value: 5
MinGameSpeed = 5

## Maximum game speed
# Setting type: UInt16
# Default value: 5000
MaxGameSpeed = 1500

## Game speed change increment
# Setting type: UInt16
# Default value: 5
GameSpeedChangeIncrement = 5

## Toggle lobby isolation
# Setting type: Boolean
# Default value: true
LobbyIsolation = true

## Should the script extender use async logging?
# Setting type: Boolean
# Default value: true
AsyncLogging = true

## Should the script extender allow the chat in non-multiplayer matches
