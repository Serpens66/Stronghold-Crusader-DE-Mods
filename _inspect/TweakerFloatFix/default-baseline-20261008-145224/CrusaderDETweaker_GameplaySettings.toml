# ========================================
# Crusader DE Tweaker - Globals Configuration
# ========================================
# Everything after a '#' is a comment - keep the '#' when you change a value:
#   BuyPrice = 52  # default: 155     (correct)
#   BuyPrice = 52 default: 155        (syntax error: the WHOLE file is ignored)
# A syntax error is reported in BepInEx\LogOutput.log as 'SYNTAX ERROR in ...' with the line number.
# Applied at every session start: new game, trail / campaign map, and loading a saved game.

["Siege Engines"]
SiegeEngineRestockStoneAmount = 20  # default: 20
SiegeEngineRestockStoneCost = 10  # default: 10
SiegeEngineInitialStoneAmount = 20  # default: 20

[Stealth]
StealthDetectionRange = 160  # default: 160
StealthTransparencyThreshold = 120  # default: 120

[Stables]
StablesHorseRegenTickTarget = 550  # default: 550 — ticks before a horse charge regenerates
StablesHorsesCap = 4  # default: 4 — WARNING: values above 4 break stable horse-link tracking

[Gatehouse]
GateHouseCloseDistance = 200  # default: 200
GateHouseReOpenDistance = 1200  # default: 1200

[Disease]
DiseaseDamage1 = 150  # default: 150 — damage tier 1 (from c_game_unit_takedamage_projectile)
DiseaseDamage2 = 200  # default: 200 — damage tier 2
DiseaseDamage3 = 400  # default: 400 — damage tier 3

[Pathfinding]
PathfindingMaxTilesConstraint = 2000  # default: 2000

["Food Consumption"]
# Modifies how often the food consumption evaluation ticks. Higher values delay the ticks (slower eating).
FoodConsumptionTickThreshold = 15000  # default: 15000
# Base rate (%) multiplier for food consumption during a tick calculation.
FoodConsumptionRate = 3  # default: 3

["Peasant Spawning"]
# How many ticks must elapse before a new peasant spawns. Lower = faster spawning.
PeasantRespawnTickTargetValue = 4000  # default: 4000
# Tick counter reset value after a spawn. Lower = fewer ticks wasted on reset.
PeasantRespawnTickResetValue = 2000  # default: 2000
# Max peasants that can be waiting at the campfire. 0 = no cap.
CampPeasantsCap = 24  # default: 24

# ========================================
# Crusader DE Tweaker - Player Options Configuration
# ========================================

["Gameplay Options"]
BetterHealers = false
FasterPeasants = false
ImprovedArabSwordsman = false
ImprovedFletchers = false
ImprovedLadderman = false
ImprovedSpearman = false
NerfEunuchs = false
NoKnockdownWalls = false
RebalancedHorseArchers = false
UncappedPeasants = false
# AI siege behaviour toggles — applied on each map load
GlobalImprovedSiegeBehaviour = false
GlobalMoreAggressiveSiegeBehaviour = false
# Master switches for the game's advanced options — auto-enabled whenever any advanced option above is set
AdvancedOptionsEnabled = false
AdvancedSkirmishOptionsEnabled = false
# Override map restrictions — set true to unlock everything regardless of map settings
AllBuildingsAvailable = false
AllUnitsAllowed = false
AllTradeGoodsAllowed = false
AllProductionGoodsAllowed = false

