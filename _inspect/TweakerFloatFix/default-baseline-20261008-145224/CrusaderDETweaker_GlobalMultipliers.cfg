[Debug]

## Enable step-by-step debug logging for all event hooks.
## WARNING: Very high log volume during gameplay. Use only when diagnosing hook issues.
## Tip: Changes apply in real-time (no restart needed).
# Setting type: Boolean
# Default value: false
DebugLogging = false

[Multipliers]

## Global multiplier for all melee damage taken by units.
## Example: Set to 1.5 to increase all melee damage by 50%, or 0.75 to reduce it by 25%.
## Note: This multiplies the final calculated damage. Minimum damage is always 1 (game uses default if damage is 0).
## Tip: For fine-grained control, edit BaseMeleeDamage and ArmorValue in the TOML config files instead.
# Setting type: Single
# Default value: 1
UnitMeleeDamageTakenMultiplier = 1

## Global multiplier for all ranged damage taken by units.
## Affects all projectile types: Arrow, Bolt, Slinger, and Javelin.
## Example: Set to 1.2 to increase all ranged damage by 20%, or 0.8 to reduce it by 20%.
## Note: This multiplies the final calculated damage. Minimum damage is always 1 (game uses default if damage is 0).
## Tip: Changes apply in real-time (no restart needed). For unit-specific changes, edit RangedArmorValue in TOML config.
# Setting type: Single
# Default value: 1
UnitRangedDamageTakenMultiplier = 1

## Global multiplier for unit max health.
## Example: Set to 1.5 to increase all unit health by 50%, or 0.75 to reduce it by 25%.
## Note: Changes apply to newly created units (existing units keep their current health).
## Tip: For unit-specific changes, edit Health property in the TOML config files.
# Setting type: Single
# Default value: 1
UnitHealthMultiplier = 1

## Global multiplier for damage taken by ALL structures (walls, towers, buildings, etc.).
## Example: Set to 1.5 to increase all structure damage by 50%, or 0.75 to reduce it by 25%.
## Note: More specific multipliers (walls, towers, etc.) are applied first, then this global multiplier.
## Tip: Changes apply in real-time (no restart needed).
# Setting type: Single
# Default value: 1
StructureDamageTakenMultiplier = 1

## Multiplier for damage taken by walls (stone walls, crenel walls).
## Example: Set to 2.0 to make walls take double damage, or 0.5 to make them more durable.
## Note: Applied before the global StructureDamageTakenMultiplier.
## Tip: Use this to fine-tune wall durability without affecting other structures.
# Setting type: Single
# Default value: 1
WallDamageTakenMultiplier = 1

## Multiplier for damage taken by towers and gatehouses.
## Affects: Tower levels 1-5, destroyed tower remnants, and gatehouses.
## Example: Set to 1.2 to make towers 20% more vulnerable, or 0.8 to make them 20% more durable.
## Note: Applied before the global StructureDamageTakenMultiplier.
## Tip: Useful for balancing siege gameplay.
# Setting type: Single
# Default value: 1
TowerDamageTakenMultiplier = 1

## Multiplier for damage taken by civilian structures (buildings, houses, workshops, etc.).
## Does NOT affect: Walls, towers, or gatehouses.
## Example: Set to 0.5 to make buildings more resilient, or 1.5 to make them more vulnerable.
## Note: Applied before the global StructureDamageTakenMultiplier.
## Tip: Use this to balance economic structure durability.
# Setting type: Single
# Default value: 1
CivilStructureDamageTakenMultiplier = 1

## Multiplier for building damage dealt by Bedouin Demolishers.
## Identified via the AttackingUnitId on the building damage event (eChimps.CHIMP_TYPE_BEDOUIN_DEMOLISHER).
## Stacks with StructureDamageTakenMultiplier.
## Tip: Changes apply in real-time (no restart needed).
# Setting type: Single
# Default value: 1
DemolisherBuildingDamageMultiplier = 1

## Multiplier for building damage dealt by Bedouin Sappers.
## Identified via the AttackingUnitId on the building damage event (eChimps.CHIMP_TYPE_BEDOUIN_SAPPER).
## Stacks with StructureDamageTakenMultiplier.
## Tip: Changes apply in real-time (no restart needed).
# Setting type: Single
# Default value: 1
SapperBuildingDamageMultiplier = 1

## Cost multiplier for low/short walls (stone walls at low height, stairs). Game default: 0.25
# Setting type: Single
# Default value: 0.25
LowWallCostMultiplier = 0.25

## Cost multiplier for high walls (stone walls at high height, crenel walls). Game default: 0.5
# Setting type: Single
# Default value: 0.5
HighWallCostMultiplier = 0.5

## Global multiplier for fire damage taken by all units.
## Example: Set to 2.0 to make units twice as vulnerable to fire, or 0.5 to halve fire damage.
## Applied once at startup (requires game restart to change). For per-unit values, edit UnitFireDamage.csv.
# Setting type: Single
# Default value: 1
UnitFireDamageTakenMultiplier = 1

## Global multiplier for fire damage taken by all structures (buildings, towers, etc.).
## Example: Set to 2.0 to make buildings burn faster, or 0.5 to make them more fire-resistant.
## Applied once at startup (requires game restart to change). For per-building values, edit BuildingFireDamage.csv.
# Setting type: Single
# Default value: 1
StructureFireDamageTakenMultiplier = 1

## Global multiplier for the healing amount provided by Bedouin healers to all unit types.
## Example: Set to 1.5 to increase healing by 50%, or 0.75 to reduce it by 25%.
## Applied once at startup (requires game restart to change). For per-unit values, edit BedouinHeal.csv.
# Setting type: Single
# Default value: 1
BedouinHealMultiplier = 1

## Global multiplier for all three disease damage tiers (DiseaseDamage1/2/3).
## Example: Set to 2.0 to double disease damage, or 0.5 to halve it.
## Applied on each map load, on top of the [Disease] base in GameplaySettings.toml.
# Setting type: Single
# Default value: 1
DiseaseDamageMultiplier = 1

