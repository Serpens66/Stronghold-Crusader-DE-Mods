# ========================================
# Crusader DE Tweaker - UNIT Configuration
# ========================================
#
# This file allows you to customize game unit properties.
# Each section [CHIMP_TYPE_...] contains properties for that specific unit.
#
# PROPERTY DESCRIPTIONS:
#
# ========================================
# BASIC PROPERTIES
# ========================================
# Health:        Maximum hit points
# Speed:         Movement speed (smaller values = faster)
# GoldCost:      Recruitment cost in gold (Crusader units only)
# WeaponType:    Equipment slot 1 — resource required to recruit (STORED_SWORDS, STORED_BOWS, STORED_CROSSBOWS,
#                  STORED_SPEARS, STORED_PIKES, STORED_MACES). "NONE" = no weapon needed (gold-only hire, like
#                  Arabian mercenaries). Deleting the line does NOT do that: a missing key = "use game default".
# ArmorType:     Equipment slot 2 — resource required to recruit (STORED_METAL_ARMOUR, STORED_LEATHER_ARMOUR, or "NONE")
# RequiresHorse: true = hiring needs a free stable horse and the unit occupies that slot until it dies.
#                  Add "RequiresHorse = true" to any recruitable unit's section - Barracks units are checked by
#                  the game, Mercenary Post units (Horse Archer, Camel Lancer, ...) by the mod at hire time.
# ShieldHealth:  Shield durability for the Bedouin Demolisher. The game stores it in 16 bits: maximum 65535
#                  (a larger value is clamped to 65535 and logged).
# MaxCount:      Limit on units of this type alive at once for the local player.
#                  -1 = unlimited (default), 0 = disabled (every spawn removed), >0 = max alive. Excess removed on spawn.
#
# ========================================
# DAMAGE SYSTEM
# ========================================
# Damage values are configured via CSV matrix files in the DamageMatrices folder:
#   - CrusaderDETweaker_MeleeDamage.csv      — unit-vs-unit melee damage
#   - CrusaderDETweaker_RangedDamage.csv     — projectile-vs-unit ranged damage
#   - CrusaderDETweaker_EunuchAoeDamage.csv  — Eunuch AoE damage
#   - CrusaderDETweaker_BallistaDamage.csv   — Ballista projectile damage
#   - CrusaderDETweaker_UnitFireDamage.csv   — fire damage taken by units
#   - CrusaderDETweaker_BuildingFireDamage.csv — fire damage taken by buildings
#   - CrusaderDETweaker_BedouinHeal.csv      — Bedouin Healer heal amounts
#
# HOW VALUES WORK:
#   A value of -1 means "use the game default" — the mod leaves that property UNCHANGED.
#   Set any other number to override it. The '# Default:' comment after each value shows the
#   game's current default and is refreshed every launch.
#   (Applies to Health, Speed, GoldCost, ShieldHealth and armor multipliers. WeaponType,
#    ArmorType and RequiresHorse are written directly ("NONE" removes an equipment requirement).
#    MaxCount: see above — there -1 = unlimited.)
#
# ========================================

