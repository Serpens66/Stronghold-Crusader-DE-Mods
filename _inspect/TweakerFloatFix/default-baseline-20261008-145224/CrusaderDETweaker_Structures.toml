# ========================================
# Crusader DE Tweaker - STRUCTURE Configuration
# ========================================
#
# This file allows you to customize game structure properties.
# Each section [STRUCT_...] contains properties for that specific structure.
#
# PROPERTY DESCRIPTIONS:
#
# Health: Maximum hit points
# GoldCost, WoodCost, StoneCost, IronCost, PitchCost: Building costs
# HousingPopulationSpace: Population capacity (housing structures only)
# MaxCount: Limit on buildings of this type placed at once for the local player.
#            -1 = unlimited (default), 0 = disabled (every placement removed), >0 = max placed. Excess removed on placement.
#
# HOW VALUES WORK:
#   A value of -1 means "use the game default" — the mod leaves that property UNCHANGED.
#   Set any other number to override it. The '# Default:' comment shows the game's current
#   default, refreshed every launch. (MaxCount: see above — there -1 = unlimited.)
#
# ========================================

[STRUCT_HOVEL]
Health = -1 # Default: 100
WoodCost = -1 # Default: 6
HousingPopulationSpace = -1 # Default: 8
MaxCount = -1  # -1 = unlimited (default), 0 = disabled, >0 = max placed at once

