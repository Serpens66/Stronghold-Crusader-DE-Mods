name: Update release status

on:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-status
  cancel-in-progress: true

jobs:
  update:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch release tags and main
        shell: pwsh
        run: git fetch --force --tags origin main

      - name: Test release-status tooling
        shell: pwsh
        run: |
          & '.\Shared\Release\Test-ReleaseStatus.ps1'

      - name: Generate badges and reports
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & '.\Shared\Release\Update-ReleaseStatus.ps1' -OutputDirectory (Join-Path $env:RUNNER_TEMP 'release-status') -HeadCommit 'origin/main'

      - name: Publish generated status branch
        shell: pwsh
        run: |
          $statusRoot = Join-Path $env:RUNNER_TEMP 'release-status'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan release-status
          git rm -r --force --ignore-unmatch .
          Copy-Item -LiteralPath (Join-Path $statusRoot 'badges') -Destination . -Recurse
          Copy-Item -LiteralPath (Join-Path $statusRoot 'reports') -Destination . -Recurse
          Copy-Item -LiteralPath (Join-Path $statusRoot 'diffs') -Destination . -Recurse
          git add --all
          git commit -m 'Update generated release status'
          git push --force origin HEAD:release-status
